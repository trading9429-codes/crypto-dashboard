<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Crypto Spike Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <style>
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fade-in-up 0.4s ease-out; }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 font-sans">

  <!-- Status Bar -->
  <div id="status-bar" 
       class="sticky top-0 z-20 bg-gray-900 text-gray-400 text-sm px-4 py-2 shadow-md flex justify-between items-center">
    <div id="connection-status" class="font-semibold">🔴 Disconnected</div>
    <div class="flex gap-2 items-center">
      <span id="last-updated">Last Updated: --</span>
      <span id="next-refresh">Next Refresh: --</span>
      <input id="min-relvol" type="number" value="1" min="0.1" step="0.1" 
             class="px-2 py-1 rounded bg-gray-800 text-white text-xs" 
             title="Minimum Relative Volume"/>
      <button id="clear-toasts" 
              class="px-2 py-1 bg-red-600 text-white rounded hover:bg-red-700 text-xs">
        Clear All Toasts
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="p-6">
    <div class="overflow-x-auto rounded-lg shadow-lg">
      <table class="table-auto w-full border-collapse border border-gray-800">
        <thead class="bg-gray-800 text-gray-300 text-sm uppercase">
          <tr>
            <th class="px-4 py-2 text-left">Symbol</th>
            <th class="px-4 py-2 text-left">Time (IST)</th>
            <th class="px-4 py-2 text-left">Volume</th>
            <th class="px-4 py-2 text-left">Rel Vol</th>
            <th class="px-4 py-2 text-left">LTP (INR)</th>
          </tr>
        </thead>
        <tbody id="data-body" class="text-sm"></tbody>
      </table>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 right-5 space-y-2 z-50"></div>

  <script>
    const statusEl = document.getElementById("connection-status");
    const REFRESH_INTERVAL = 30;
    let countdown = REFRESH_INTERVAL;
    let countdownTimer;
    let lastData = {};
    let ws;
    const rowMap = new Map();
    let minRelVolFilter = parseFloat(document.getElementById("min-relvol").value);

    // Update filter
    document.getElementById("min-relvol").addEventListener("change", (e) => {
      minRelVolFilter = parseFloat(e.target.value);
      renderTable(lastData);
    });

    // WebSocket connect
    function connectWS () {
      ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => {
        statusEl.textContent = "🟢 Connected";
        statusEl.className = "mb-4 text-sm text-green-400";
      };
   
      ws.onclose = () => {
        statusEl.textContent = "🔴 Disconnected";
        statusEl.classList.remove("text-green-400");
        statusEl.classList.add("text-red-400");
        clearInterval(countdownTimer);
        document.getElementById("next-refresh").textContent = "Next Refresh: --";
        setTimeout(connectWS, 3000);
      };

      ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        renderTable(data);
      };
    }

    // Persistent Toast
    function showToast(symbol, time) {
      const container = document.getElementById("toast-container");
      const existing = container.querySelector(`[data-symbol="${symbol}"][data-time="${time}"]`);
      if (existing) return;

      const toast = document.createElement("div");
      toast.classList.add(
        "px-4", "py-2", "rounded-lg", "shadow-lg",
        "bg-gray-800", "text-white", "flex", "justify-between", "items-center",
        "animate-fade-in-up"
      );
      toast.dataset.symbol = symbol;
      toast.dataset.time = time;

      toast.innerHTML = `
        <span>Spike: ${symbol} @ ${time}</span>
        <button class="ml-4 text-gray-400 hover:text-white">&times;</button>
      `;

      toast.querySelector("button").addEventListener("click", () => toast.remove());
      container.appendChild(toast);
    }

    // Clear All Toasts
    document.getElementById("clear-toasts").addEventListener("click", () => {
      document.getElementById("toast-container").innerHTML = "";
    });

    // Render Table efficiently
    function renderTable(data) {
      const body = document.getElementById("data-body");

      Object.entries(data).forEach(([symbol, entries]) => {
        const latest = entries[0];
        if (!latest) return;

        const { time, volume, avg, ltp_inr } = latest;
        const relVol = avg > 0 ? volume / avg : 0;
        if (relVol < minRelVolFilter) return;

        let tr = rowMap.get(symbol);
        if (!tr) {
          tr = document.createElement("tr");
          tr.classList.add("border-b", "border-gray-800", "hover:bg-gray-800", "transition");
          tr.innerHTML = `
            <td class="py-2 font-bold">
              <a href="https://www.tradingview.com/chart/?symbol=BINANCE:${symbol}" target="_blank" class="text-blue-400 hover:underline">${symbol}</a>
            </td>
            <td class="py-2"></td>
            <td class="py-2 text-green-400"></td>
            <td class="py-2 text-yellow-400"></td>
            <td class="py-2 text-pink-400"></td>
          `;
          body.appendChild(tr);
          rowMap.set(symbol, tr);
          tr.classList.add("bg-blue-700");
          setTimeout(() => tr.classList.remove("bg-blue-700"), 2000);
          showToast(symbol, time);
        }

        const tds = tr.children;
        tds[1].textContent = time;
        tds[2].textContent = volume.toFixed(2);
        tds[3].textContent = relVol.toFixed(2);
        tds[4].textContent = `₹${ltp_inr?.toLocaleString("en-IN", { maximumFractionDigits: 2 }) || "-"}`;
      });

      // Update last-updated & countdown
      document.getElementById("last-updated").textContent =
        "Last Updated: " + moment().format("YYYY-MM-DD HH:mm:ss");
      countdown = REFRESH_INTERVAL;
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        document.getElementById("next-refresh").textContent =
          "Next Refresh: " + countdown + "s";
        if (countdown <= 0) clearInterval(countdownTimer);
        countdown--;
      }, 1000);

      lastData = data;
    }

    // Start WebSocket
    connectWS();
  </script>
</body>
</html>
